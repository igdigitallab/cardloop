name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the workflow token is read-only; no job below needs more.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      # IMPORTANT: tests MUST run via venv/bin/python — pytest-aiohttp lives in
      # the venv, and ~237 endpoint tests error under a bare system interpreter.
      - name: Bootstrap venv
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      # Static analysis of the Python sources (rule set: see ruff.toml).
      - name: Lint (ruff)
        run: venv/bin/ruff check .

      # A provider-routing test (test_chat_sse.py::test_codex_chat_routes_thread...) assumes the
      # Codex provider flag is on, which a developer's own .env sets; a clean CI runner has no
      # .env, so set it here.
      - name: Run tests
        env:
          CODEX_ENABLED: "true"
        run: env -u WEB_COOKIE_SECURE venv/bin/python -m pytest tests/ -q

      - name: Dependency audit (non-blocking)
        run: |
          venv/bin/pip install pip-audit
          venv/bin/pip-audit --progress-spinner off || true

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint (ESLint)
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
