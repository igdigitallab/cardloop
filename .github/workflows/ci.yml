name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the workflow token is read-only; no job below needs more.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # IMPORTANT: tests MUST run via venv/bin/python — pytest-aiohttp lives in
      # the venv, and ~237 endpoint tests error under a bare system interpreter.
      - name: Bootstrap venv
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      # Static analysis of the Python sources (rule set: see ruff.toml).
      - name: Lint (ruff)
        run: venv/bin/ruff check .

      # A provider-routing test (test_chat_sse.py::test_codex_chat_routes_thread...) assumes the
      # Codex provider flag is on, which a developer's own .env sets; a clean CI runner has no
      # .env, so set it here.
      - name: Run tests
        env:
          CODEX_ENABLED: "true"
        run: env -u WEB_COOKIE_SECURE venv/bin/python -m pytest tests/ -q

      - name: Dependency audit (non-blocking)
        run: |
          venv/bin/pip install pip-audit
          venv/bin/pip-audit --progress-spinner off || true

  e2e:
    # tests/e2e (spec-072): boots the real cockpit with the scripted fake engine (no SDK, no
    # tokens) and drives the BUILT web UI with headless Chromium. The only suite that sees what
    # the operator sees: a render bug can pass every unit test and still ship.
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The harness serves web/dist and fails with a clear message when it is missing.
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build

      - name: Bootstrap venv
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium
        run: venv/bin/python -m playwright install --with-deps chromium

      - name: Run e2e
        run: venv/bin/python -m pytest tests/e2e -m e2e -q

      # Each cockpit the suite boots writes server.log into its pytest tmp dir; a failed boot or
      # a server-side traceback is only visible there.
      - name: Cockpit logs (on failure)
        if: failure()
        run: |
          for f in $(find /tmp/pytest-of-* -name server.log 2>/dev/null); do
            echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"
          done

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint (ESLint)
        working-directory: web
        run: npm run lint

      - name: Unit tests (node:test)
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
