# OpenSSF Scorecard — supply-chain health checks, published to https://scorecard.dev.
# NOTE: with `publish_results: true` the Scorecard API rejects workflows that add top-level
# env/defaults, workflow-level write permissions, or steps outside the approved action list —
# keep this file minimal and put anything else in another workflow.
# Results are NOT uploaded to the repo's code-scanning dashboard: that would mirror Scorecard's
# accepted-low checks (no branch protection / code review on a direct-push repo) as open
# "alerts" next to the real CodeQL findings. Scorecard's own viewer and API carry the result.
name: Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "23 5 * * 6" # weekly, Saturday 05:23 UTC
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC token needed to publish results
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
