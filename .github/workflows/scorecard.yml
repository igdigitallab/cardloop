# OpenSSF Scorecard — supply-chain health checks, published to https://scorecard.dev.
# NOTE: with `publish_results: true` the Scorecard API rejects workflows that add top-level
# env/defaults, workflow-level write permissions, or steps outside the approved action list —
# keep this file minimal and put anything else in another workflow.
name: Scorecard

on:
  push:
    branches: [master]
  schedule:
    - cron: "23 5 * * 6" # weekly, Saturday 05:23 UTC
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload to the code-scanning dashboard
      id-token: write # OIDC token needed to publish results
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
