[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::RuntimeWarning:unittest.mock
markers =
    e2e: end-to-end browser tests (tests/e2e) — boot a real cockpit subprocess with a
        scripted fake engine and drive it via Playwright. Excluded from the default
        run (see addopts below); run explicitly with:
        venv/bin/python -m pytest tests/e2e -m e2e
    aliases: ground-truth model-alias check (tests/test_model_aliases.py) — probes the
        real bundled CLI + live /v1/models to assert each alias runs the newest model of
        its family. Needs the subscription token; excluded from the default run. Run with:
        venv/bin/python -m pytest tests/test_model_aliases.py -m aliases
    grok_live: spec-095 — drives the REAL `grok` binary (tests/test_grok_live.py): compat
        isolation, sandbox denial, one real end-to-end turn. Spends model turns on the SuperGrok
        subscription and needs a login in the cockpit's GROK_HOME (tools/grok-acct login).
        Excluded from the default run; skips cleanly when the binary/login/bwrap is missing.
        venv/bin/python -m pytest tests/test_grok_live.py -m grok_live
    grok_canary: spec-095 §6.10 — egress canary: a repo with a multi-MB blob in git history, one
        "reply OK" turn, fail if any single connection sends more than 1 MiB. Run by hand after
        every `grok` update and before enabling a new project. Excluded from the default run.
        venv/bin/python -m pytest tests/test_grok_live.py -m grok_canary
# spec-072: keep the (slow, browser-dependent) e2e suite out of the default `pytest
# tests/` run. The `aliases` check is likewise opt-in (needs the live token + CLI probes).
# An explicit `-m e2e`/`-m aliases` on the command line overrides this (argparse keeps the
# last value for a single-valued option), which is how those suites are run. The two grok_*
# markers (real binary, real model turns) are opt-in the same way.
addopts = -m "not e2e and not aliases and not grok_live and not grok_canary"
